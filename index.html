<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Roller</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f8;
      color: #172033;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(92vw, 430px);
      background: #ffffff;
      border: 1px solid #dce2ea;
      border-radius: 28px;
      padding: 34px 26px 28px;
      box-shadow: 0 18px 50px rgba(23, 32, 51, 0.13);
      text-align: center;
    }

    .title {
      margin: 0 0 26px;
      font-size: clamp(1.8rem, 7vw, 2.45rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .cube-wrap {
      min-height: 220px;
      display: grid;
      place-items: center;
      perspective: 700px;
    }

    .cube {
      width: 190px;
      aspect-ratio: 1;
      position: relative;
      background: #fff;
      border: 4px solid #172033;
      border-radius: 32px;
      box-shadow:
        inset 0 -8px 0 rgba(23, 32, 51, 0.07),
        0 14px 24px rgba(23, 32, 51, 0.16);
      transform: rotate(0deg) scale(1);
      transition: transform 180ms ease;
    }

    .cube.bump {
      transform: rotate(8deg) scale(0.93);
    }

    .spot {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      background: #172033;
      position: absolute;
      opacity: 0;
      transform: scale(0.65);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .spot.on {
      opacity: 1;
      transform: scale(1);
    }

    .p1 { top: 25px; left: 25px; }
    .p2 { top: 25px; left: 50%; translate: -50% 0; }
    .p3 { top: 25px; right: 25px; }
    .p4 { top: 50%; left: 25px; translate: 0 -50%; }
    .p5 { top: 50%; left: 50%; translate: -50% -50%; }
    .p6 { top: 50%; right: 25px; translate: 0 -50%; }
    .p7 { bottom: 25px; left: 25px; }
    .p8 { bottom: 25px; left: 50%; translate: -50% 0; }
    .p9 { bottom: 25px; right: 25px; }

    .roll-btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px 24px;
      margin-top: 26px;
      background: #2458e6;
      color: #fff;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 7px 0 #163ba9;
      transition: transform 90ms ease, box-shadow 90ms ease;
      touch-action: manipulation;
    }

    .roll-btn:hover {
      background: #1f4fd2;
    }

    .roll-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #163ba9;
    }

    .roll-btn:focus-visible {
      outline: 4px solid rgba(36, 88, 230, 0.25);
      outline-offset: 4px;
    }

    .result {
      min-height: 28px;
      margin: 18px 0 0;
      font-size: 1rem;
      font-weight: 700;
      color: #59657a;
    }

    @media (max-width: 420px) {
      .card {
        padding: 28px 20px 24px;
      }

      .cube {
        width: 165px;
        border-radius: 27px;
      }

      .spot {
        width: 25px;
        height: 25px;
      }

      .p1 { top: 22px; left: 22px; }
      .p2 { top: 22px; }
      .p3 { top: 22px; right: 22px; }
      .p4 { left: 22px; }
      .p6 { right: 22px; }
      .p7 { bottom: 22px; left: 22px; }
      .p8 { bottom: 22px; }
      .p9 { bottom: 22px; right: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cube,
      .spot,
      .roll-btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">Number Roller</h1>

    <div class="cube-wrap" aria-live="polite">
      <div class="cube" id="cube" aria-label="Result 1">
        <span class="spot p1"></span>
        <span class="spot p2"></span>
        <span class="spot p3"></span>
        <span class="spot p4"></span>
        <span class="spot p5 on"></span>
        <span class="spot p6"></span>
        <span class="spot p7"></span>
        <span class="spot p8"></span>
        <span class="spot p9"></span>
      </div>
    </div>

    <button class="roll-btn" id="rollBtn" type="button">ROLL</button>
    <p class="result" id="result">Result: 1</p>
  </main>

  <script>
    const cube = document.getElementById("cube");
    const rollBtn = document.getElementById("rollBtn");
    const result = document.getElementById("result");
    const spots = [...document.querySelectorAll(".spot")];

    const faces = {
      1: [5],
      2: [1, 9],
      3: [1, 5, 9],
      4: [1, 3, 7, 9],
      5: [1, 3, 5, 7, 9],
      6: [1, 3, 4, 6, 7, 9]
    };

    function fairNumber() {
      const box = new Uint32Array(1);
      const cap = 4294967292;
      let value;

      do {
        crypto.getRandomValues(box);
        value = box[0];
      } while (value >= cap);

      return (value % 6) + 1;
    }

    function paint(value) {
      const active = faces[value];

      spots.forEach((spot, index) => {
        spot.classList.toggle("on", active.includes(index + 1));
      });

      cube.setAttribute("aria-label", `Result ${value}`);
      result.textContent = `Result: ${value}`;
    }

    rollBtn.addEventListener("click", () => {
      cube.classList.remove("bump");
      void cube.offsetWidth;
      cube.classList.add("bump");

      const value = fairNumber();

      setTimeout(() => {
        paint(value);
        cube.classList.remove("bump");
      }, 110);
    });
  </script>
</body>
</html>
